# Records the story narration with an AI voice and publishes the MP3 files as assets of the
# release "story-audio", where the app streams them from. Run it by hand from the Actions tab.
#
# Needs (Settings → Secrets and variables → Actions):
#   secret   ELEVENLABS_API_KEY   (never in the app or in the repository)
#   variable NARRATOR_VOICE_ID    (the ElevenLabs voice to use)
# Only changed texts are recorded again (manifest.json keeps a hash per clip).
name: story-audio

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Story ids to record, comma separated (empty = all). Example: nuh-ark"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: story-audio
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release for the audio files
        run: gh release view story-audio >/dev/null 2>&1 || gh release create story-audio --latest=false --title "Story narration" --notes "MP3 narration streamed by the app («حكايات قبل النوم»). Generated by the story-audio workflow."
      - name: Previous manifest
        run: gh release download story-audio -p manifest.json -D prev || true
      - name: Record changed clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NARRATOR_VOICE_ID: ${{ vars.NARRATOR_VOICE_ID }}
          ONLY: ${{ inputs.only }}
        run: |
          set -e
          extra=""
          if [ -n "$ONLY" ]; then extra="--only $ONLY"; fi
          node scripts/narrate-stories.mjs --out out --manifest prev/manifest.json $extra
      - name: Publish
        run: gh release upload story-audio out/* --clobber
